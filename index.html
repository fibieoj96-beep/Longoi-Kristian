<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Longoi Kristian</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Longoi">
    <link rel="icon" type="image/png" href="asset/icon/icon.png">
    <link rel="apple-touch-icon" href="asset/icon/icon.png">
    <link rel="stylesheet" href="style.css">
</head>

<header class="textured-header" id="main-header">
    <div class="header-slot-left">
        <button id="back-button" class="back-pill" onclick="goBack()" style="display: none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>BACK</span>
        </button>
    </div>
    <h1 id="header-title">Longoi</h1>
    <div class="header-slot-right">
    <div class="menu-container" style="position: relative;">
        <button id="main-menu-btn" onclick="toggleAppMenu(event)" style="
    background: var(--text-main); 
    border: none; 
    color: var(--bg); 
    padding: 6px; 
    border-radius: 8px; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
">
    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
</button>
        <div id="app-dropdown" style="display:none; position:absolute; right:-45px; top:35px; background:var(--surface); border:1px solid var(--border); border-radius:12px; min-width:200px; z-index:1000; box-shadow:0 10px 25px rgba(0,0,0,0.1); overflow:hidden;">
    
    <div onclick="initLiturgiBuilder()" style="padding:12px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span style="font-size:14px; font-weight:500;">Liturgi</span>
    </div>

    <div onclick="initFootnote()" style="padding:12px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span style="font-size:14px; font-weight:500;">Faves</span>
    </div>
  
   <div onclick="document.getElementById('app-dropdown').style.display='none'; resetAppKeras();" style="padding:12px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); color: #ff4444;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        </svg>
        <span style="font-size:14px; font-weight:600;">Reset App</span>
    </div>
    
<div onclick="toggleDarkMode(); event.stopPropagation();" style="padding:12px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; color:var(--text-main);">
    
    <div class="icon-toggle" id="dark-toggle" style="margin:0; position:static; display:flex; align-items:center;">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform: scaleX(-1);">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"              ></path>
                   </svg>
               </div>
            </div>
         </div>
      </div>
   </div>
</header>

<main id="main-content">
    <div class="search-wrapper" id="search-area">
        <div class="search-box" id="search-container" onclick="expandSearch()">
            <input type="text" id="search-input" placeholder="Search..." onkeyup="handleSearch()">
            <div class="search-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
        </div>
    </div>
    <div id="app-list">
        <p style="text-align: center; padding: 40px; color: var(--text-dim);">Loading...</p>
    </div>
</main>

<nav class="tabbar" id="tabbar">
    <div class="nav-indicator"></div>
    <button class="nav-item active" onclick="changeCategory('hymns', this)">
        <img src="asset/icon/longoi-active.png" class="icon-active">
        <img src="asset/icon/longoi-dim.png" class="icon-dim">
        <span class="nav-label">Longoi</span>
    </button>
    <button class="nav-item" onclick="changeCategory('psalms', this)">
        <img src="asset/icon/zabur-active.png" class="icon-active">
        <img src="asset/icon/zabur-dim.png" class="icon-dim">
        <span class="nav-label">Zabur</span>
    </button>
    <button class="nav-item" onclick="changeCategory('bible', this)">
        <img src="asset/icon/alkitab-active.png" class="icon-active">
        <img src="asset/icon/alkitab-dim.png" class="icon-dim">
        <span class="nav-label">Alkitab</span>
    </button>
    <button class="nav-item" onclick="changeCategory('prayers', this)">
        <img src="asset/icon/doa-active.png" class="icon-active">
        <img src="asset/icon/doa-dim.png" class="icon-dim">
        <span class="nav-label">Doa</span>
    </button>
    <button class="nav-item" onclick="changeCategory('liturgies', this)">
        <img src="asset/icon/hoturan-active.png" class="icon-active">
        <img src="asset/icon/hoturan-dim.png" class="icon-dim">
        <span class="nav-label">Hoturan</span>
    </button>
    <button class="nav-item" onclick="changeCategory('others', this)">
        <img src="asset/icon/more-active.png" class="icon-active">
        <img src="asset/icon/more-dim.png" class="icon-dim">
        <span class="nav-label">Vokon</span>
    </button>
</nav>

<div class="tabbar-watermark" style=" background: #ffffff !important;">Hak Cipta © 2026 Terpelihara</div>

<div id="highlight-popup" style="display:none; position:fixed; bottom:40px; left:50%; transform:translateX(-50%); background:var(--text-main); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); padding:12px 10px; border-radius:25px; z-index:10000; box-shadow:0 15px 35px rgba(0,0,0,0.6); width:180px; height:50px;">
    <div style="text-align:center; color:var(--bg); font-weight:800; margin-bottom:10px; font-size:0.7rem; letter-spacing:1.5px; text-transform:uppercase;">Highlight</div>
    
    <div style="display:flex; justify-content:space-evenly; align-items:center; gap:8px;">
        <div onclick="applyHighlight('rgba(255,255,0,0.4)')" style="width:20px; height:20px; background:#ffeb3b; border-radius:50%; cursor:pointer; border:2px solid rgba(255,255,255,0.2); box-shadow:0 2px 8px rgba(255,255,0,0.2);"></div>
        
        <div onclick="applyHighlight('rgba(0,255,0,0.3)')" style="width:20px; height:20px; background:#4caf50; border-radius:50%; cursor:pointer; border:2px solid rgba(255,255,255,0.2); box-shadow:0 2px 8px rgba(0,255,0,0.2);"></div>
        
        <div onclick="applyHighlight('rgba(0,200,255,0.3)')" style="width:20px; height:20px; background:#00bcd4; border-radius:50%; cursor:pointer; border:2px solid rgba(255,255,255,0.2); box-shadow:0 2px 8px rgba(0,200,255,0.2);"></div>
        
        <div onclick="applyHighlight('transparent')" style="width:20px; height:20px; background:rgba(255,255,255,0.1); border-radius:50%; cursor:pointer; border:1px solid rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; color:#ff5252; font-weight:bold; font-size:16px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<script src="./app.js"></script>

</body>
</html>
